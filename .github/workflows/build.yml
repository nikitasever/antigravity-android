name: Build Antigravity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test PC Bridge
        run: |
          npm --prefix pc-bridge ci --no-audit --no-fund
          npm --prefix pc-bridge test

      - name: Run unit tests & build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Antigravity-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Android-apk
          path: |
            Antigravity-Android.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Antigravity-Android.apk
            app/build/outputs/apk/debug/app-debug.apk
          name: "Google Antigravity Android ${{ github.ref_name }}"
          generate_release_notes: true

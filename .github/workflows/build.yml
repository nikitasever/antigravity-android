name: Build Antigravity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests & build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Antigravity-Android-2.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Android-2.0.0-apk
          path: |
            Antigravity-Android-2.0.0.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Antigravity-Android-2.0.0.apk
            app/build/outputs/apk/debug/app-debug.apk
          name: "Google Antigravity Android ${{ github.ref_name }}"
          body_path: ROUND5_RELEASE_NOTES.md
          generate_release_notes: true

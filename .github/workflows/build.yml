name: Build Antigravity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test PC Bridge
        run: |
          npm --prefix pc-bridge ci --no-audit --no-fund
          npm --prefix pc-bridge test

      - name: Validate release request
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const changed = cp.execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD', '--', '.github/release.json'], {encoding:'utf8'}).trim();
          if (!changed && !process.env.GITHUB_REF.startsWith('refs/tags/')) process.exit(0);
          const request = JSON.parse(fs.readFileSync('.github/release.json', 'utf8'));
          const version = fs.readFileSync('app/build.gradle.kts', 'utf8').match(/versionName\s*=\s*"([^"]+)"/)?.[1];
          if (!/^v\d+\.\d+\.\d+$/.test(request.tag) || request.tag !== `v${version}` || typeof request.name !== 'string' || /[\r\n]/.test(request.name)) throw new Error('Invalid release request/version');
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF !== `refs/tags/${request.tag}`) throw new Error('Tag does not match release request');
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/tags/${request.tag}`, {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version':'2022-11-28'}});
            if (response.status !== 404) {
              if (!response.ok) throw new Error(`Cannot check release tag: HTTP ${response.status}`);
              if ((await response.json()).object.sha !== process.env.GITHUB_SHA) throw new Error('Release tag already points to a different commit');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=true\ntag=${request.tag}\nname=${request.name}\n`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Run tests, lint and independent Debug/Release builds
        run: |
          chmod +x ./gradlew
          python3 -m unittest discover -s scripts -p 'test_release_artifacts.py'
          ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify signed release artifacts against CI builds
        if: steps.release.outputs.publish == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
          python3 scripts/release_artifacts.py --sdk "$ANDROID_HOME"

      - name: Upload CI build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-CI-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/test-results/
            app/build/reports/lint-results-*.html

      - name: Upload verified signed APKs
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-verified-release
          path: |
            Antigravity-Android.apk
            Antigravity-Android-debug-local.apk
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Antigravity-Android.apk
            Antigravity-Android-debug-local.apk
            SHA256SUMS.txt
          tag_name: ${{ steps.release.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name || github.ref_name }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="geolocation=(self)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Update both integrity hashes when upgrading Mapbox. -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css"
      rel="stylesheet"
      integrity="sha384-HkKE+85evOIM4qXyZgXD0f1jM0vm5WiEt53/ijMQBUdR6106IiF0fTdurbpvDrAA"
      crossorigin="anonymous">
    <script
      src="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.js"
      integrity="sha384-R2FTsgjfxVwYulfFm2tYM4yvUCzV1TsO9JE94rhB/OIPeLbhDFZBmIORVpqa+gCq"
      crossorigin="anonymous"></script>
    <style>
      :root {
        color-scheme: light;
        --map-background: #e6e9ef;
        --map-controls-bottom-padding: 0px;

        /* Compact map attribution */
        --map-attribution-surface: #fcfcfc;
        --map-attribution-hover: #f9f9f9;
        --map-attribution-primary: #0d0d0d;
        --map-attribution-secondary: rgba(0, 0, 0, 0.6);
        --map-attribution-tertiary: rgba(0, 0, 0, 0.29);

        /* Primary pill */
        --marker-primary-bg: #ffffff;
        --marker-primary-fg: #000000;
        --marker-primary-border: rgba(0, 0, 0, 0.15);

        /* Inverse pill (selected) */
        --marker-inverse-bg: #000000;
        --marker-inverse-fg: #ffffff;
        --marker-inverse-border: rgba(255, 255, 255, 1);

        /* Pointer gradients (use bg + border/fg split) */
        --pointer-primary-a: var(--marker-primary-bg);
        --pointer-primary-b: var(--marker-primary-border);

        --pointer-inverse-a: var(--marker-inverse-bg);
        --pointer-inverse-b: var(--marker-inverse-border);

        --marker-selection-transition-duration: 180ms;

        /* User location accent defaults (overridden from JS). */
        --user-accent-color: #1a73e8;
        --user-accent-shadow: rgba(26, 115, 232, 0.24);
        --user-accent-heading: rgba(26, 115, 232, 0.65);
      }

      body { margin: 0; padding: 0; background-color: var(--map-background); font-family: "Roboto", sans-serif; }
      #map { position: absolute; top: 0; bottom: 0; width: 100%; background-color: var(--map-background); }

      .mapboxgl-ctrl-bottom-left,
      .mapboxgl-ctrl-bottom-right {
        bottom: var(--map-controls-bottom-padding);
      }

      .mapboxgl-ctrl.mapboxgl-ctrl-attrib.mapboxgl-compact {
        background-color: var(--map-attribution-surface);
        border-radius: 6px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        box-sizing: border-box;
        color: var(--map-attribution-secondary);
        direction: ltr;
        font-family: "Roboto", sans-serif;
        font-size: 10px;
        font-weight: 300;
        height: 20px;
        line-height: 20px;
        margin: 20px;
        max-width: calc(100vw - 40px);
        min-height: 20px;
        overflow: visible;
        padding: 0;
        position: relative;
        transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
        width: 20px;
      }

      .mapboxgl-ctrl.mapboxgl-ctrl-attrib.mapboxgl-compact-show {
        height: auto;
        max-height: calc(100vh - 40px);
        overflow: visible;
        padding: 0;
        white-space: normal;
        width: max-content;
      }

      .mapboxgl-ctrl-bottom-left > .mapboxgl-ctrl-attrib.mapboxgl-compact-show,
      .mapboxgl-ctrl-bottom-right > .mapboxgl-ctrl-attrib.mapboxgl-compact-show {
        max-height: calc(100vh - var(--map-controls-bottom-padding) - 40px);
      }

      .mapboxgl-ctrl-bottom-right > .mapboxgl-ctrl-attrib.mapboxgl-compact-show {
        /* Wide text can reach the logo in the opposite corner; keep their vertical bounds separate. */
        margin-bottom: 30px;
      }

      .mapboxgl-ctrl-attrib.mapboxgl-compact .mapboxgl-ctrl-attrib-inner {
        color: var(--map-attribution-secondary);
        display: none;
        height: 20px;
        line-height: 20px;
      }

      .mapboxgl-ctrl-attrib.mapboxgl-compact-show .mapboxgl-ctrl-attrib-inner {
        box-sizing: border-box;
        display: block;
        height: auto;
        line-height: 14px;
        max-height: inherit;
        min-height: 20px;
        overflow: auto;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .mapboxgl-ctrl-top-left > .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-inner,
      .mapboxgl-ctrl-bottom-left > .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-inner {
        padding: 3px 4px 3px 28px;
      }

      .mapboxgl-ctrl-top-right > .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-inner,
      .mapboxgl-ctrl-bottom-right > .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-inner {
        padding: 3px 28px 3px 4px;
      }

      .mapboxgl-ctrl-attrib a {
        color: var(--map-attribution-secondary);
        text-decoration: none;
      }

      .mapboxgl-ctrl-attrib a:hover {
        color: var(--map-attribution-secondary);
        text-decoration: underline;
      }

      .mapboxgl-ctrl-attrib .map-attribution-terms {
        margin-inline-end: 8px;
      }

      .mapboxgl-ctrl-attrib.mapboxgl-compact-show .map-attribution-terms {
        margin-inline-end: 4px;
      }

      .mapboxgl-ctrl-attrib .mapbox-improve-map {
        color: var(--map-attribution-tertiary);
        font-weight: 300;
        margin-left: 0;
      }

      .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-button,
      .mapboxgl-ctrl-attrib.mapboxgl-compact-show .mapboxgl-ctrl-attrib-button {
        align-items: center;
        background-color: transparent;
        background-image: none;
        border-radius: 6px;
        color: var(--map-attribution-primary);
        display: flex;
        height: 20px;
        justify-content: center;
        padding: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
      }

      .mapboxgl-ctrl-top-left .mapboxgl-ctrl-attrib-button,
      .mapboxgl-ctrl-bottom-left .mapboxgl-ctrl-attrib-button {
        left: 0;
        right: auto;
      }

      .mapboxgl-ctrl-top-right .mapboxgl-ctrl-attrib-button,
      .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-attrib-button {
        left: auto;
        right: 0;
      }

      .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-button::before {
        content: "";
        inset: -14px;
        position: absolute;
      }

      .mapboxgl-ctrl-top-left > .mapboxgl-ctrl-attrib.mapboxgl-compact-show .mapboxgl-ctrl-attrib-button::before,
      .mapboxgl-ctrl-bottom-left > .mapboxgl-ctrl-attrib.mapboxgl-compact-show .mapboxgl-ctrl-attrib-button::before {
        inset: -14px -8px -14px -20px;
      }

      .mapboxgl-ctrl-top-right > .mapboxgl-ctrl-attrib.mapboxgl-compact-show .mapboxgl-ctrl-attrib-button::before,
      .mapboxgl-ctrl-bottom-right > .mapboxgl-ctrl-attrib.mapboxgl-compact-show .mapboxgl-ctrl-attrib-button::before {
        inset: -14px -20px -14px -8px;
      }

      .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-button:hover {
        background-color: var(--map-attribution-hover);
      }

      .mapboxgl-ctrl-attrib .mapboxgl-ctrl-attrib-button:focus-visible {
        box-shadow: inset 0 0 0 2px #0096ff;
      }

      .map-attribution-icon {
        fill: none;
        height: 12px;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
        width: 12px;
      }

      .map-attribution-icon.close,
      .mapboxgl-compact-show .map-attribution-icon.info {
        display: none;
      }

      .mapboxgl-compact-show .map-attribution-icon.close {
        display: block;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --map-background: #0f1216;

        --map-attribution-surface: #000000;
        --map-attribution-hover: #212121;
        --map-attribution-primary: #ececec;
        --map-attribution-secondary: rgba(255, 255, 255, 0.7);
        --map-attribution-tertiary: rgba(255, 255, 255, 0.58);

        /* Primary becomes dark */
        --marker-primary-bg: #000000;
        --marker-primary-fg: #ffffff;
        --marker-primary-border: rgba(255, 255, 255, 0.25);

        /* Inverse becomes light */
        --marker-inverse-bg: #ffffff;
        --marker-inverse-fg: #000000;
        --marker-inverse-border: rgba(0, 0, 0, 1);
      }

      .custom-marker {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: none;
        z-index: 1;
      }

      .custom-marker.selected {
        z-index: 3;
      }

      .custom-marker.unselected:not(.minimized) {
        z-index: 2;
      }

      .custom-marker.marker-fade-in {
        animation: markerFadeIn 180ms ease-out;
      }

      .custom-marker.marker-expand-from-minimized .marker-pill {
        animation: markerExpandFromMinimized var(--marker-selection-transition-duration) ease-in-out;
        animation-delay: var(--marker-selection-transition-delay, 0ms);
        animation-fill-mode: both;
        transform-origin: center;
      }

      .custom-marker.marker-expand-from-minimized .marker-details,
      .custom-marker.marker-expand-from-minimized .marker-label {
        animation: markerDetailsAppear var(--marker-selection-transition-duration) ease-in-out;
        animation-delay: var(--marker-selection-transition-delay, 0ms);
        animation-fill-mode: both;
      }

      @media (prefers-reduced-motion: reduce) {
        .custom-marker.marker-fade-in,
        .custom-marker.marker-expand-from-minimized .marker-pill,
        .custom-marker.marker-expand-from-minimized .marker-details,
        .custom-marker.marker-expand-from-minimized .marker-label {
          animation: none;
        }
      }

      @keyframes markerFadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes markerExpandFromMinimized {
        from {
          transform: scale(0.14, 0.31);
        }
        to {
          transform: scale(1);
        }
      }

      @keyframes markerDetailsAppear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .custom-marker .marker-pill {
        position: relative;
        font-size: 12px;
        font-weight: 500;
        border-radius: 20px;
        padding: 4px 8px;
        min-width: 6px;
        min-height: 14px;

        border: none;
        box-shadow:
          0 0 0 0.5px var(--marker-primary-border),
          0 2px 6px rgba(0, 0, 0, 0.15);
        background: var(--marker-primary-bg);
        color: var(--marker-primary-fg);
      }

      .custom-marker .marker-pin-label {
        white-space: nowrap;
        font-weight: 600;
      }

      .custom-marker .marker-pin-emoji {
        font-size: 14px;
        line-height: 1;
      }

      .custom-marker.minimized.unselected .marker-pill {
        box-sizing: border-box;
        width: 8px;
        height: 8px;
        min-width: 8px;
        min-height: 8px;
        padding: 0;
        border: 1.5px solid #ffffff;
        background: #000000;
      }

      .custom-marker.selected .marker-pill {
        background: var(--marker-inverse-bg);
        color: var(--marker-inverse-fg);
        border: 2px solid var(--marker-inverse-border);
      }

      /* Pointer (inverse for selected) */
      .custom-marker.selected .marker-pill::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -4.25px;
        width: 8px;
        height: 8px;
        border-radius: 2px;

        background: linear-gradient(
          135deg,
          var(--pointer-inverse-a) 0%,
          var(--pointer-inverse-a) 50%,
          var(--pointer-inverse-b) 50%,
          var(--pointer-inverse-b) 100%
        );

        transform: translateX(-50%) rotate(45deg);
      }

      .custom-marker .marker-label {
        max-width: 120px;
        padding: 2px 6px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 1;

        color: #0f172a;
        text-shadow:
          -1px -1px 0 rgba(255, 255, 255, 0.7),
           1px -1px 0 rgba(255, 255, 255, 0.7),
          -1px  1px 0 rgba(255, 255, 255, 0.7),
           1px  1px 0 rgba(255, 255, 255, 0.7),
           0  2px 3px rgba(0, 0, 0, 0.28);
      }

      .custom-marker.minimized.selected .marker-label {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        width: max-content;
        transform: translateX(-50%);
      }

      :root[data-theme="dark"] .custom-marker .marker-label {
        color: #f8fafc;
        text-shadow:
          -1px -1px 0 rgba(0, 0, 0, 0.9),
           1px -1px 0 rgba(0, 0, 0, 0.9),
          -1px  1px 0 rgba(0, 0, 0, 0.9),
           1px  1px 0 rgba(0, 0, 0, 0.9),
           0  2px 3px rgba(0, 0, 0, 0.55);
      }

      /* Star icon: make SVG respect CSS color */
      .custom-marker .marker-pill .star-icon {
        width: 12px;
        height: 12px;
        vertical-align: middle;
        fill: currentColor;
        stroke: currentColor;
        position: relative;
        top: -1px;
      }

      /* Optional: star colors (tweak as you like) */
      .custom-marker.selected .marker-pill .star-icon { color: currentColor; }

      /* Defensive fallback: fully suppress Mapbox's built-in user-location UI. */
      .mapboxgl-user-location-dot,
      .mapboxgl-user-location-dot::before,
      .mapboxgl-user-location-dot::after,
      .mapboxgl-user-location-show-heading,
      .mapboxgl-user-location-show-heading .mapboxgl-user-location-heading,
      .mapboxgl-user-location-show-heading .mapboxgl-user-location-heading::before,
      .mapboxgl-user-location-show-heading .mapboxgl-user-location-heading::after,
      .mapboxgl-user-location-accuracy-circle {
        opacity: 0 !important;
        animation: none !important;
        box-shadow: none !important;
        border: 0 !important;
      }

      .user-location-overlay {
        position: relative;
        width: 36px;
        height: 36px;
        pointer-events: none;
        --user-accent-color: #1a73e8;
        --user-accent-shadow: rgba(26, 115, 232, 0.24);
        --user-accent-heading: rgba(26, 115, 232, 0.65);
      }

      .user-location-heading {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 22px solid var(--user-accent-heading);
        transform: translate(-50%, -100%) rotate(var(--user-heading, 0deg));
        transform-origin: 50% 100%;
        opacity: 0;
        transition: opacity 120ms ease-out;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
      }

      .user-location-overlay.has-heading .user-location-heading {
        opacity: 1;
      }

      .user-location-avatar,
      .user-location-accent-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 3px solid var(--marker-primary-fg);
        box-shadow:
          0 3px 6px rgba(0, 0, 0, 0.25),
          0 0 0 5px var(--user-accent-shadow);
        background: var(--user-accent-color);
      }

      .user-location-avatar {
        width: 26px;
        height: 26px;
        object-fit: cover;
        background: #ffffff;
      }

      .user-location-accent-dot {
        width: 18px;
        height: 18px;
      }

    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="mapbox.js"></script>
  </body>
</html>
